# Stage 6 RECIPE_LOCK (spec F5) - written 2026-10-28, BEFORE any FINAL
# refit training and before any Final access. Every number below is read
# from a REAL successful run on this pod, not estimated from prose.
# Budget rule chosen for the data-merged FINAL refit (locked now, not
# during training): the recipes below are UPDATE-BUDGET-DEFINED; refits
# keep the same update budget and DISCLOSE the coverage change.

stage1:
  source_run: results/s4v46/stage1_a3_clean_m2_v1/REPORT.json (8000 updates)
    + handoff parents dexycb M1 CHECKPOINT_UPDATE_08000 / ho3d M1 00800
  optimizer: AdamW lr 7.5e-5, weight_decay 1e-4, betas [0.9, 0.999], eps 1e-8
  effective_batch: 4 (2x2 microbatch accumulation)
  grad_clip: 1.0
  lr_schedule: linear warmup 400 updates, then cosine to floor 0.1 of base
  updates: {hanco: 8000, dexycb: 8000, ho3d: 800}
  view_distribution: uniform; variant M1
  endpoint: final-update checkpoint, no Dev-based selection
r_head:
  source_run: a3_clean_retrain.py train_r (a3clean seeds 23/24/25)
  optimizer: AdamW lr 3e-4, weight_decay 1e-4
  batch: 64; epochs: 10 over the registered fit8192 bundle (1280 updates;
    ho3d 4056-group bundle -> 634)
  loss: (mpvpe + 0.5 * mesh_mpjpe).mean()
  geometry_stats: 104-dim masked mean/std recomputed from the TRAINING
    bundle (clean_stats formula)
  endpoint: epoch-10 checkpoint
ref_head:
  source_run: ref23_train gate3 REPORT (3840 updates / 10 epochs) and
    a3_clean_retrain train_ref
  model: MultiViewRefinement, displacement_bound_m 0.005, zero-init
    identity gate must be exactly 0.0 before training
  optimizer: AdamW lr 3e-4, weight_decay 1e-4
  effective_batch: 64 in microbatches of 8; epochs: 10 (single-ds 1280
    updates; shared variants 1280 x n_datasets)
  x0: recomputed LIVE from the stage R head (never a stored bundle x0)
  gamma: 0.5 outside-blend is the registered DexYCB/HO3D deployment
    identity (GATE4); the a3clean/hanco Ref outputs the endpoint directly
  endpoint: epoch-10 checkpoint
final_refit_hanco:
  segment: sequences 0-1199 = v24_hanco_a3_fit_v1 (75,198 groups,
    TrainCore 68,127 + InnerVal 7,071) + v24_hanco_a3_development_v1
    (7,084 groups); FINAL 1200-1516 NEVER enters any stage
  rule: update-budget-defined recipes above kept verbatim; per-stage
    eligible/unique/presentation counts reported; R/Ref train on an
    8192-group bundle drawn from the merged segment with the SAME
    sequence-stratified selector as the registered fit8192
    (s_common.seq_stratified, salt kept), selection frozen before use
  initialization: official legal bases (frozen HaMeR; fresh heads);
    no Final-related warm start
metrics:
  implementation: stage6/metrics2.py (sha recorded in every runs.csv
    eval_key); POEM-21 reader via build_poem_published_21_regressor
  bootstrap: sequence-clustered, B=1000, stat_seed 20261028
no_further_tuning: >
  No learning-rate, budget, gamma, loss or architecture change is
  permitted after this file for any FINAL_REFIT_ROLE training. Real code
  defects found later are fixed with a version note and the affected
  paired rows rerun (spec C), never by widening this lock.
