[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alignhand"
version = "1.0.0"
description = "AlignHand: multi-view hand reconstruction from a frozen monocular prior"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24,<2", "torch>=2.1", "PyYAML>=6.0"]

[project.optional-dependencies]
data = ["opencv-python-headless>=4.7,<4.12", "webdataset>=0.2.86", "smplx>=0.1.28", "scipy"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mvhand*"]
